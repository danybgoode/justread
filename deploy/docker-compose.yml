# panfleto production stack.
#
# Nothing here publishes a port. The VM's shared proxy (edge-caddy, danybgoode/oracle-edge) reaches
# landing and miniflux over the external `edge` network as panfleto-landing / panfleto-miniflux; Postgres is
# only on this project's own network. Until 2026-10-29 Caddy was a service in this file. State lives on /data (the block volume), so the instance itself
# stays disposable.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: miniflux
    volumes:
      - /data/panfleto/postgres:/var/lib/postgresql/data
    # shared_buffers is deliberately generous for a database this small: Always
    # Free instances are reclaimed after 7 days below 20% CPU *and* memory *and*
    # network, and holding ~3 GB resident keeps us clear of the memory trigger.
    command: >
      postgres
      -c shared_buffers=3GB
      -c effective_cache_size=6GB
      -c max_connections=50
    # The cap leaves headroom above the deliberate 3 GB of shared_buffers. The VM is shared by three tenants
    # (oracle-edge TENANTS.md); an uncapped tenant is the one the kernel's OOM killer can take everyone down with.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux"]
      interval: 10s
      timeout: 5s
      retries: 10

  miniflux:
    # Built in CI, not here (Roadmap/09-platform-infra/ci-build-pipeline). update.sh writes
    # MINIFLUX_IMAGE into deploy/.env from the panfleto-core submodule pin, so every DEPLOY runs
    # exactly the commit `main` points at; deploy/.env may also pin it by hand to roll back (D8).
    #
    # The fallback is the moving branch tag, and it is not decoration: compose interpolates this file
    # for almost every subcommand, so a hard `:?` here would break `docker compose exec`, `logs`, and
    # with them backup.sh's nightly pg_dump - the only recovery path on this host - for anyone who
    # ran a compose command before the first update.sh. The fallback keeps those working; update.sh
    # always overrides it with an exact SHA, and warns if the reader reports a different version.
    image: ${MINIFLUX_IMAGE:-ghcr.io/danybgoode/panfleto-core:panfleto}
    # Emergency local build. The registry path has to fail at 3am exactly once for this to earn its
    # keep: uncomment these three lines, comment out `image:` above, then `docker compose build
    # miniflux && docker compose up -d miniflux`. Delete this block once a pull-based deploy has
    # succeeded twice (ci-build-pipeline's Rollback section).
    #build:
    #  context: ../panfleto-core
    #  dockerfile: packaging/docker/alpine/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://miniflux:${POSTGRES_PASSWORD}@postgres/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${ADMIN_USERNAME:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      BASE_URL: https://app.panfleto.win
      LISTEN_ADDR: "0.0.0.0:8080"
      POLLING_FREQUENCY: "60"
      BATCH_SIZE: "100"
      # Article autofetch (Roadmap/01-reading-experience/article-autofetch, D4). On by default here and
      # killed in deploy/.env, then `docker compose up -d miniflux`: FORCE_CRAWLER=0 stops new feeds
      # crawling, FETCH_FALLBACK_CHAIN= (empty) stops external fallbacks, PREFETCH_WORKERS=0 puts
      # scraping back on the poll path. Every one of them at 0/empty is upstream Miniflux's behaviour.
      FORCE_CRAWLER: ${FORCE_CRAWLER:-1}
      # Wallhop is opt-in until its API is probed from this VM: set unwall,wallhop in deploy/.env.
      FETCH_FALLBACK_CHAIN: ${FETCH_FALLBACK_CHAIN-unwall}
      FETCH_THIN_CONTENT_THRESHOLD: ${FETCH_THIN_CONTENT_THRESHOLD:-2000}
      PREFETCH_WORKERS: ${PREFETCH_WORKERS:-2}
      PREFETCH_HOST_DELAY: ${PREFETCH_HOST_DELAY:-2}
      # Starter-feed onboarding runs INSIDE this container on the Auth0 signup path
      # (internal/ui/user_onboarding.go, from oauth2_callback.go). These two were passed only to
      # `landing`, so the notification code ran and silently did nothing on every SSO signup - the
      # bug Roadmap/02-onboarding-and-signup/onboarding-provisioning-reliability starts from.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Both were hardcoded in the Go and the TypeScript. Unset = the values that were compiled in.
      PANFLETO_TELEGRAM_CHAT_ID: ${PANFLETO_TELEGRAM_CHAT_ID:-}
      PANFLETO_EMAIL_FROM: ${PANFLETO_EMAIL_FROM:-}
    # Auth0 SSO is opt-in and lives in its own file. Miniflux rejects
    # OAUTH2_PROVIDER when it is set but empty - not just when it is invalid -
    # so the variable has to be genuinely absent, which `environment:` cannot
    # express. An absent oauth.env means password login; see oauth.env.example.
    env_file:
      - path: ./oauth.env
        required: false
    networks:
      default:
      edge:
        aliases: [panfleto-miniflux]
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  landing:
    # Built by CI (.github/workflows/landing-image.yml) and pulled; update.sh writes LANDING_IMAGE into deploy/.env.
    # The fallback is the last locally built tag, so `compose logs/exec` keep working before the first update.sh,
    # the same reason miniflux has one. Emergency local build: uncomment `build:` and run
    # `docker compose build landing && docker compose up -d landing`.
    image: ${LANDING_IMAGE:-deploy-landing}
    #build:
    #  context: ../landing-page
    #  dockerfile: ../deploy/landing.Dockerfile
    restart: unless-stopped
    depends_on:
      - miniflux
    environment:
      # Talks to Miniflux over the compose network, not back out through
      # Cloudflare - faster, and it works before DNS is cut over.
      MINIFLUX_API_URL: http://miniflux:8080/v1
      MINIFLUX_ADMIN_USERNAME: ${ADMIN_USERNAME:?}
      MINIFLUX_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PANFLETO_TELEGRAM_CHAT_ID: ${PANFLETO_TELEGRAM_CHAT_ID:-}
      PANFLETO_EMAIL_FROM: ${PANFLETO_EMAIL_FROM:-}
      NODE_ENV: production
      PORT: "3000"
    networks:
      default:
      edge:
        aliases: [panfleto-landing]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  # The shared proxy's network (danybgoode/oracle-edge). update.sh creates it when missing.
  edge:
    external: true
